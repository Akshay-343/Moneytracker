name: Publish Backend Image

# Builds the API image on every merge to main that touches backend/.
# Tagged with the version from backend/app/__init__.py and with latest.
# The frontend has no image: Render builds it straight from the repository.
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/publish-images.yml"]
  workflow_dispatch:

concurrency:
  group: publish-backend-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish pursely-api
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Read version and image name
        id: version
        run: |
          echo "value=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/app/__init__.py)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pursely-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:v${{ steps.version.outputs.value }}
            ${{ steps.version.outputs.image }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
